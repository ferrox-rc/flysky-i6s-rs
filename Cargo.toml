[package]
name = "flysky-i6x-rs"
version = "0.18.1"
edition = "2021"

[lib]
name = "flysky_i6x_rs"
path = "src/lib.rs"

[[bin]]
name = "flysky-i6x-rs"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
stm32f0xx-hal = { version = "0.18.0", features = ["stm32f072", "rt"] }
embedded-graphics = "0.8.1"
embedded-icon = { version = "0.0.1", default-features = false, features = ["12px", "mdi"] }
usb-device = "0.3.2"
stm32-usbd = "0.8.0"
usbd-hid = "0.10.2"
usbd-serial = "0.2.2"
sequential-storage = "8.0.1"
embedded-storage = "0.3.2"
embedded-storage-async = "0.4.1"

[features]
default = ["stm32"]
stm32 = []
apm32 = []

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Enable Link-Time Optimization
codegen-units = 1   # Maximize LTO optimization across crates
panic = "abort"     # Remove stack unwinding overhead
debug = true        # Keep debug symbols for probe-rs / GDB
