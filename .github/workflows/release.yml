name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Firmware Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: llvm-tools-preview

      - name: Install cargo-binutils
        run: cargo install cargo-binutils || true

      - name: Build firmware (release)
        run: cargo build --release --target thumbv6m-none-eabi

      - name: Generate Binary and Hex Artifacts
        run: |
          BIN_NAME=$(cargo read-manifest | jq -r '.name')
          ELF_PATH="target/thumbv6m-none-eabi/release/${BIN_NAME}"
          OUT_BIN="${BIN_NAME}.bin"
          OUT_HEX="${BIN_NAME}.hex"
          OUT_ELF="${BIN_NAME}.elf"

          cargo objcopy --release -- -O binary "${OUT_BIN}"
          cargo objcopy --release -- -O ihex "${OUT_HEX}"
          cp "${ELF_PATH}" "${OUT_ELF}"
          sha256sum "${OUT_BIN}" "${OUT_HEX}" "${OUT_ELF}" > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.bin
            *.hex
            *.elf
            sha256sums.txt
          generate_release_notes: true
