name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-build:
    name: Check, Clippy & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy (-D warnings)
        run: cargo clippy --target thumbv6m-none-eabi -- -D warnings

      - name: Run host unit tests
        run: cargo test-host

      - name: Build release binary
        run: cargo build --release --target thumbv6m-none-eabi

      - name: Install cargo-binutils
        run: cargo install cargo-binutils || true

      - name: Check binary footprint
        run: cargo size --release -- -A
